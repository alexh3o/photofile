[package]
name = "photoboggan"
version = "0.3.5"
description = "Gestionnaire de photos desktop ultra-performant"
authors = ["alexh3o"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.39", features = ["full"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.25.0"
kamadak-exif = "0.6.1"
# Génération des miniatures en Rust (module thumbnails.rs) : crates en Rust pur, sans bibliothèque native à distribuer.
# jpeg-decoder sans la fonctionnalité rayon : le parallélisme se fait entre images, pas à l'intérieur d'un décodage.
jpeg-decoder = { version = "0.3", default-features = false }
jpeg-encoder = "0.6"
# Redimensionnement par lot (module resize.rs) : lecture et écriture des PNG. Crate en Rust pur déjà présente dans l'arbre de dépendances (via Tauri) :
# aucune bibliothèque native à distribuer.
png = "0.18"
walkdir = "2.5.0"
rayon = "1.10.0"
chrono = "0.4.38"
tauri-plugin-dialog = "2.8.2"
# Copie de fichiers dans le presse-papiers de l'OS (commande copy_files_to_clipboard) : Windows, macOS et Linux (X11 ; pour Wayland,
# ajouter la fonctionnalité « wayland »). Sans « image » : on ne copie que des listes de fichiers, pas de pixels.
clipboard-rs = { version = "0.3", default-features = false }
# Suppression des photos vers la corbeille de l'OS (commande delete_photos) : Windows (API Windows via la crate `windows`, aucune DLL à distribuer),
# macOS et Linux (corbeille freedesktop).
trash = "5"
# Décodage des photos HEIC / HEIF (miniatures, plein écran, redimensionnement) : décodeur HEVC en Rust pur (MIT OR Apache-2.0), sans DLL ni outil de build natif.
# La crate demande Rust 1.85 minimum (edition 2024). La fonctionnalité par défaut « parallel » utilise rayon, déjà présent ci-dessus.
heic-rs = "0.1.4"
